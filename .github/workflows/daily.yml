name: daily-article-and-deploy

on:
  schedule:
    - cron: '0 5 * * *'   # 08:00 بتوقيت السعودية يومياً
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write today's article
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generate.js
      - name: Commit new article
        if: github.event_name != 'push'
        run: |
          git config user.name "tahaluf-blog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "article: $(date -u +%F)" && git push)
      - run: node build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
